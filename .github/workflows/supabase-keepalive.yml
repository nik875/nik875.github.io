name: Supabase Keep-Alive

# Supabase pauses free-tier projects after ~7 days of database inactivity.
# This pings the subscribers table twice a week so the project never pauses.
# The publishable key is the site's public anon key (already public in the
# site's JavaScript); row access is protected by RLS.

on:
  schedule:
    - cron: '0 9 * * 1,4' # Mon & Thu at 09:00 UTC
  workflow_dispatch: # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "${{ vars.SUPABASE_URL }}/rest/v1/pending_notifications?select=*&limit=1" \
            -H "apikey: sb_publishable_pR2rrr5U61QB8ulRmg4Trg_mfec0hSk")
          echo "Supabase responded with HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::error::Could not reach Supabase — project may be paused. Resume it in the Supabase dashboard."
            exit 1
          fi
